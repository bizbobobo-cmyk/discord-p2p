<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>P2P Chat & Voice</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');
        body { font-family: 'Inter', sans-serif; background-color: #313338; margin: 0; color: #dbdee1; }
        .scale-in { animation: scaleIn 0.2s ease-out; }
        @keyframes scaleIn { from { transform: scale(0.95); opacity: 0; } to { transform: scale(1); opacity: 1; } }
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: #2b2d31; }
        ::-webkit-scrollbar-thumb { background: #1e1f22; border-radius: 4px; }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef } = React;

        const App = () => {
            // Persistence
            const [username, setUsername] = useState(localStorage.getItem('p2p-username') || '');
            const [isUsernameSet, setIsUsernameSet] = useState(!!localStorage.getItem('p2p-username'));
            const [messages, setMessages] = useState(JSON.parse(localStorage.getItem('p2p-messages')) || []);
            const [inputText, setInputText] = useState('');
            
            // Connection State
            const [connState, setConnState] = useState('disconnected');
            const [localSdp, setLocalSdp] = useState(localStorage.getItem('p2p-local-sdp') || '');
            const [remoteSdp, setRemoteSdp] = useState(localStorage.getItem('p2p-remote-sdp') || '');
            const [isGenerating, setIsGenerating] = useState(false);
            const [showConnectModal, setShowConnectModal] = useState(false);
            const [copySuccess, setCopySuccess] = useState(false);

            const pc = useRef(null);
            const dataChannel = useRef(null);

            // Sync persistence
            useEffect(() => { localStorage.setItem('p2p-username', username); }, [username]);
            useEffect(() => { localStorage.setItem('p2p-messages', JSON.stringify(messages)); }, [messages]);
            useEffect(() => { localStorage.setItem('p2p-local-sdp', localSdp); }, [localSdp]);
            useEffect(() => { localStorage.setItem('p2p-remote-sdp', remoteSdp); }, [remoteSdp]);

            const initPeer = () => {
                if (pc.current) return;
                
                // Using standard Google STUN server to bypass most firewalls
                pc.current = new RTCPeerConnection({
                    iceServers: [{ urls: 'stun:stun.l.google.com:19302' }]
                });

                pc.current.onicecandidate = (e) => {
                    // When e.candidate is null, it means ICE gathering is complete
                    if (!e.candidate && pc.current.localDescription) {
                        setLocalSdp(JSON.stringify(pc.current.localDescription));
                        setIsGenerating(false);
                    }
                };

                pc.current.onconnectionstatechange = () => {
                    setConnState(pc.current.connectionState);
                };

                pc.current.ondatachannel = (e) => {
                    dataChannel.current = e.channel;
                    setupDataChannel(e.channel);
                };
            };

            const setupDataChannel = (channel) => {
                channel.onopen = () => setConnState('connected');
                channel.onclose = () => setConnState('disconnected');
                channel.onmessage = (e) => {
                    const msg = JSON.parse(e.data);
                    setMessages(prev => [msg, ...prev]);
                };
            };

            const generateInvite = async () => {
                setIsGenerating(true);
                initPeer();
                
                try {
                    dataChannel.current = pc.current.createDataChannel('chat');
                    setupDataChannel(dataChannel.current);
                    
                    const offer = await pc.current.createOffer();
                    await pc.current.setLocalDescription(offer);
                    
                    // Fallback: If ICE takes too long, set what we have
                    setTimeout(() => {
                        if (isGenerating) {
                            setLocalSdp(JSON.stringify(pc.current.localDescription));
                            setIsGenerating(false);
                        }
                    }, 3000);
                } catch (err) {
                    console.error(err);
                    setIsGenerating(false);
                    alert("Handshake failed. Try refreshing.");
                }
            };

            const acceptInvite = async () => {
                if (!remoteSdp) return;
                try {
                    const remoteDesc = JSON.parse(remoteSdp);
                    initPeer();
                    
                    await pc.current.setRemoteDescription(new RTCSessionDescription(remoteDesc));
                    
                    if (remoteDesc.type === 'offer') {
                        const answer = await pc.current.createAnswer();
                        await pc.current.setLocalDescription(answer);
                        // The ICE candidate logic will update localSdp with the answer for the friend to paste back
                    }
                } catch (err) {
                    alert("Invalid code. Make sure you copied the whole block of text.");
                }
            };

            const sendMessage = () => {
                if (!inputText.trim()) return;
                const msg = {
                    id: Date.now(),
                    user: username,
                    content: inputText,
                    timestamp: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })
                };
                
                if (dataChannel.current?.readyState === 'open') {
                    dataChannel.current.send(JSON.stringify(msg));
                }
                setMessages(prev => [msg, ...prev]);
                setInputText('');
            };

            const reset = () => {
                localStorage.clear();
                window.location.reload();
            };

            if (!isUsernameSet) {
                return (
                    <div className="flex h-screen w-full items-center justify-center bg-[#1e1f22]">
                        <div className="bg-[#313338] p-8 rounded-lg shadow-xl w-80 text-center scale-in">
                            <h2 className="text-xl font-bold mb-4">What's your name?</h2>
                            <input 
                                value={username} 
                                onChange={e => setUsername(e.target.value)}
                                onKeyDown={e => e.key === 'Enter' && username && setIsUsernameSet(true)}
                                className="w-full bg-[#1e1f22] p-2 rounded mb-4 outline-none border border-white/10" 
                            />
                            <button 
                                onClick={() => username && setIsUsernameSet(true)}
                                className="w-full bg-[#5865f2] py-2 rounded font-bold hover:bg-[#4752c4]"
                            >
                                Start
                            </button>
                        </div>
                    </div>
                );
            }

            return (
                <div className="flex h-screen w-full bg-[#313338]">
                    {/* Sidebar */}
                    <div className="w-64 bg-[#2b2d31] flex flex-col border-r border-black/20">
                        <div className="p-4 font-bold border-b border-black/20 shadow-sm flex justify-between items-center">
                            <span>P2P Network</span>
                            <div className={`w-2 h-2 rounded-full ${connState === 'connected' ? 'bg-green-500' : 'bg-red-500'}`} />
                        </div>
                        <div className="flex-1 p-4 space-y-2">
                            <div className="text-xs font-bold text-[#949ba4] uppercase">Channels</div>
                            <div className="bg-[#3f4147] p-2 rounded text-white flex items-center">
                                <i data-lucide="hash" className="w-4 h-4 mr-2"></i> general
                            </div>
                        </div>
                        <div className="p-2 bg-[#232428] flex items-center space-x-2">
                            <div className="w-8 h-8 bg-[#5865f2] rounded-full flex items-center justify-center text-xs font-bold">{username[0]?.toUpperCase()}</div>
                            <div className="flex-1 text-xs font-bold truncate">{username}</div>
                            <button onClick={() => setShowConnectModal(true)} className="bg-[#313338] p-1.5 rounded hover:bg-[#3f4147]">
                                <i data-lucide="link" className="w-4 h-4"></i>
                            </button>
                        </div>
                    </div>

                    {/* Chat */}
                    <div className="flex-1 flex flex-col min-w-0">
                        <div className="h-12 border-b border-black/20 flex items-center px-4 shadow-sm bg-[#313338] z-10">
                            <span className="font-bold text-white"># general</span>
                        </div>
                        
                        <div className="flex-1 overflow-y-auto p-4 flex flex-col-reverse space-y-reverse space-y-4">
                            {messages.map(m => (
                                <div key={m.id} className="group flex items-start space-x-3 hover:bg-black/5 p-1 rounded">
                                    <div className="w-10 h-10 bg-[#5865f2] rounded-full flex-shrink-0 flex items-center justify-center font-bold">{m.user[0]?.toUpperCase()}</div>
                                    <div>
                                        <div className="flex items-baseline space-x-2">
                                            <span className="font-bold text-white text-sm">{m.user}</span>
                                            <span className="text-[10px] text-[#949ba4]">{m.timestamp}</span>
                                        </div>
                                        <p className="text-sm leading-6">{m.content}</p>
                                    </div>
                                </div>
                            ))}
                            {messages.length === 0 && (
                                <div className="text-center py-10 opacity-30 italic text-sm">No messages yet. Connect with a friend to start chatting.</div>
                            )}
                        </div>

                        <div className="p-4">
                            <div className="bg-[#383a40] rounded-lg px-4 py-2 flex items-center shadow-inner">
                                <input 
                                    className="flex-1 bg-transparent outline-none text-sm" 
                                    placeholder="Message #general" 
                                    value={inputText}
                                    onChange={e => setInputText(e.target.value)}
                                    onKeyDown={e => e.key === 'Enter' && sendMessage()}
                                />
                                <button onClick={sendMessage} className="text-[#b5bac1] hover:text-white transition-colors">
                                    <i data-lucide="send" className="w-5 h-5"></i>
                                </button>
                            </div>
                        </div>
                    </div>

                    {/* Connection Modal */}
                    {showConnectModal && (
                        <div className="fixed inset-0 bg-black/70 flex items-center justify-center z-50 p-4 backdrop-blur-sm">
                            <div className="bg-[#313338] w-full max-w-md rounded-xl p-6 shadow-2xl border border-white/5 scale-in">
                                <h2 className="text-xl font-bold text-center mb-6">Link with a Friend</h2>
                                
                                <div className="space-y-6">
                                    <section>
                                        <p className="text-[10px] font-bold text-[#b5bac1] uppercase mb-2">1. Your Connection Code</p>
                                        <button 
                                            onClick={generateInvite} 
                                            disabled={isGenerating}
                                            className={`w-full py-2 rounded font-bold transition-all ${isGenerating ? 'bg-gray-600 animate-pulse' : 'bg-[#5865f2] hover:bg-[#4752c4]'}`}
                                        >
                                            {isGenerating ? 'Generating...' : localSdp ? 'Regenerate Code' : 'Create My Code'}
                                        </button>
                                        {localSdp && !isGenerating && (
                                            <button 
                                                onClick={() => { navigator.clipboard.writeText(localSdp); setCopySuccess(true); setTimeout(() => setCopySuccess(false), 2000); }}
                                                className="w-full mt-2 bg-[#23a559] py-2 rounded font-bold flex items-center justify-center"
                                            >
                                                <i data-lucide={copySuccess ? "check" : "copy"} className="w-4 h-4 mr-2"></i>
                                                {copySuccess ? 'Copied!' : 'Copy My Code'}
                                            </button>
                                        )}
                                    </section>

                                    <section>
                                        <p className="text-[10px] font-bold text-[#b5bac1] uppercase mb-2">2. Paste Friend's Code</p>
                                        <textarea 
                                            className="w-full bg-[#1e1f22] p-2 rounded h-20 text-[10px] font-mono outline-none resize-none border border-white/5"
                                            placeholder="Paste the code your friend sent you..."
                                            value={remoteSdp}
                                            onChange={e => setRemoteSdp(e.target.value)}
                                        />
                                        <button 
                                            onClick={acceptInvite}
                                            className="w-full mt-2 bg-white text-black py-2 rounded font-bold hover:bg-gray-200"
                                        >
                                            Link Friend
                                        </button>
                                    </section>
                                </div>

                                <div className="mt-8 flex justify-between text-xs font-bold">
                                    <button onClick={reset} className="text-red-400 hover:underline">Reset Everything</button>
                                    <button onClick={() => setShowConnectModal(false)} className="text-[#949ba4] hover:text-white">Close</button>
                                </div>
                            </div>
                        </div>
                    )}
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
        setInterval(() => lucide.createIcons(), 1000);
    </script>
</body>
</html>
