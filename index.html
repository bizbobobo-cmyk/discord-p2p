<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GitHub P2P Chat & Voice</title>
    <!-- Tailwind CSS for styling -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <!-- React and Babel to run JSX in the browser -->
    <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');
        body { font-family: 'Inter', sans-serif; background-color: #313338; margin: 0; }
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: #2b2d31; }
        ::-webkit-scrollbar-thumb { background: #1e1f22; border-radius: 4px; }
        .scale-in { animation: scaleIn 0.2s ease-out; }
        @keyframes scaleIn { from { transform: scale(0.95); opacity: 0; } to { transform: scale(1); opacity: 1; } }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef } = React;

        const App = () => {
            // --- Persistence Logic ---
            const savedUsername = localStorage.getItem('p2p-username') || '';
            const savedMessages = JSON.parse(localStorage.getItem('p2p-messages')) || [
                { id: 1, user: 'System', content: 'Welcome! Create servers on the left or connect with a friend to start chatting.', timestamp: 'System Message', system: true }
            ];
            const savedServers = JSON.parse(localStorage.getItem('p2p-servers')) || [
                { id: 'home', name: 'Home', icon: 'github' }
            ];

            const [username, setUsername] = useState(savedUsername);
            const [isUsernameSet, setIsUsernameSet] = useState(!!savedUsername);
            const [activeServer, setActiveServer] = useState('home');
            const [servers, setServers] = useState(savedServers);
            const [messages, setMessages] = useState(savedMessages);
            const [inputText, setInputText] = useState('');
            
            // Modals
            const [showConnectModal, setShowConnectModal] = useState(false);
            const [showServerModal, setShowServerModal] = useState(false);
            const [showProfileModal, setShowProfileModal] = useState(false);
            
            // WebRTC State
            const [connState, setConnState] = useState('disconnected');
            const [sdpData, setSdpData] = useState('');
            const [remoteSdp, setRemoteSdp] = useState('');
            const [copySuccess, setCopySuccess] = useState(false);
            
            // Voice State
            const [isJoiningVoice, setIsJoiningVoice] = useState(false);
            const [isInVoiceRoom, setIsInVoiceRoom] = useState(false);
            const [isMicMuted, setIsMicMuted] = useState(false);

            const pc = useRef(null);
            const dataChannel = useRef(null);
            const localStream = useRef(null);
            const remoteAudio = useRef(new Audio());

            // Save data
            useEffect(() => { localStorage.setItem('p2p-username', username); }, [username]);
            useEffect(() => { localStorage.setItem('p2p-messages', JSON.stringify(messages)); }, [messages]);
            useEffect(() => { localStorage.setItem('p2p-servers', JSON.stringify(servers)); }, [servers]);

            // WebRTC Logic
            const initPeer = () => {
                if (pc.current) return;
                pc.current = new RTCPeerConnection({ iceServers: [{ urls: 'stun:stun.l.google.com:19302' }] });
                
                pc.current.onicecandidate = (e) => {
                    if (!e.candidate) setSdpData(JSON.stringify(pc.current.localDescription));
                };

                pc.current.ondatachannel = (e) => {
                    dataChannel.current = e.channel;
                    setupChannel(e.channel);
                };

                pc.current.ontrack = (e) => {
                    remoteAudio.current.srcObject = e.streams[0];
                    remoteAudio.current.play();
                    setIsInVoiceRoom(true);
                };

                pc.current.onconnectionstatechange = () => setConnState(pc.current.connectionState);
            };

            const setupChannel = (channel) => {
                channel.onopen = () => setConnState('connected');
                channel.onmessage = (e) => {
                    const msg = JSON.parse(e.data);
                    setMessages(prev => [msg, ...prev]);
                };
            };

            const createOffer = async () => {
                initPeer();
                dataChannel.current = pc.current.createDataChannel('chat');
                setupChannel(dataChannel.current);
                const offer = await pc.current.createOffer();
                await pc.current.setLocalDescription(offer);
            };

            const connectToFriend = async () => {
                if (!remoteSdp) return;
                const desc = new RTCSessionDescription(JSON.parse(remoteSdp));
                if (!pc.current) initPeer();
                
                if (desc.type === 'offer') {
                    await pc.current.setRemoteDescription(desc);
                    const answer = await pc.current.createAnswer();
                    await pc.current.setLocalDescription(answer);
                } else {
                    await pc.current.setRemoteDescription(desc);
                }
            };

            const joinVoiceChannel = async () => {
                if (connState !== 'connected') {
                    alert("Please connect with a friend first using the 'Connect' button!");
                    return;
                }
                setIsJoiningVoice(true);
                try {
                    localStream.current = await navigator.mediaDevices.getUserMedia({ audio: true });
                    localStream.current.getTracks().forEach(track => pc.current.addTrack(track, localStream.current));
                    
                    // Renegotiate if we added tracks after initial connection
                    const offer = await pc.current.createOffer();
                    await pc.current.setLocalDescription(offer);
                    setSdpData(JSON.stringify(pc.current.localDescription));
                    setShowConnectModal(true); // Need to share new SDP
                } catch (err) {
                    console.error("Mic access denied");
                }
                setIsJoiningVoice(false);
            };

            const leaveVoice = () => {
                if (localStream.current) {
                    localStream.current.getTracks().forEach(track => track.stop());
                }
                setIsInVoiceRoom(false);
                // Simple way to reset peer for this demo is a refresh or state clear
                // For production, you'd remove tracks from PC
            };

            const sendMessage = () => {
                if (!inputText.trim()) return;
                const msg = {
                    id: Date.now(),
                    user: username || 'Guest',
                    content: inputText,
                    timestamp: `Today at ${new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })}`
                };
                if (dataChannel.current?.readyState === 'open') {
                    dataChannel.current.send(JSON.stringify(msg));
                }
                setMessages(prev => [msg, ...prev]);
                setInputText('');
            };

            const addServer = (name) => {
                const newServer = { id: Date.now().toString(), name, icon: 'hash' };
                setServers([...servers, newServer]);
                setShowServerModal(false);
            };

            if (!isUsernameSet) {
                return (
                    <div className="flex h-screen w-full items-center justify-center bg-[#1e1f22]">
                        <div className="bg-[#313338] p-8 rounded-lg shadow-2xl w-full max-w-sm text-center border border-white/5 scale-in">
                            <h2 className="text-2xl font-bold text-white mb-6">Enter Your Name</h2>
                            <input 
                                autoFocus
                                value={username}
                                onChange={(e) => setUsername(e.target.value)}
                                onKeyDown={(e) => e.key === 'Enter' && username.trim() && setIsUsernameSet(true)}
                                placeholder="Username"
                                className="w-full bg-[#1e1f22] p-3 rounded text-white outline-none border border-white/10 focus:border-[#5865f2] mb-4"
                            />
                            <button 
                                onClick={() => username.trim() && setIsUsernameSet(true)}
                                className="w-full bg-[#5865f2] hover:bg-[#4752c4] text-white py-3 rounded font-bold transition-all"
                            >
                                Enter Chat
                            </button>
                        </div>
                    </div>
                );
            }

            return (
                <div className="flex h-screen w-full text-[#dbdee1] overflow-hidden antialiased">
                    {/* Left Sidebar: Servers */}
                    <div className="w-[72px] bg-[#1e1f22] flex flex-col items-center py-3 space-y-2 flex-shrink-0">
                        {servers.map(server => (
                            <div 
                                key={server.id}
                                onClick={() => setActiveServer(server.id)}
                                className={`w-12 h-12 rounded-[24px] flex items-center justify-center cursor-pointer transition-all duration-200 group relative
                                    ${activeServer === server.id ? 'rounded-[16px] bg-[#5865f2] text-white' : 'bg-[#313338] text-[#23a559] hover:rounded-[16px] hover:bg-[#23a559] hover:text-white'}
                                `}
                            >
                                <i data-lucide={server.icon || 'hash'} className="w-6 h-6"></i>
                                {activeServer === server.id && <div className="absolute -left-3 w-2 h-8 bg-white rounded-r-full" />}
                            </div>
                        ))}
                        <div className="w-8 h-[2px] bg-[#35363c] rounded-full mx-auto" />
                        <div 
                            onClick={() => setShowServerModal(true)}
                            className="w-12 h-12 bg-[#313338] rounded-[24px] flex items-center justify-center text-[#23a559] hover:bg-[#23a559] hover:text-white hover:rounded-[16px] transition-all cursor-pointer"
                        >
                            <i data-lucide="plus"></i>
                        </div>
                    </div>

                    {/* Middle Sidebar: Channels */}
                    <div className="w-60 bg-[#2b2d31] flex flex-col flex-shrink-0">
                        <div className="h-12 px-4 flex items-center border-b border-[#1e1f22] font-bold text-white shadow-sm">
                            <span className="truncate">{servers.find(s => s.id === activeServer)?.name}</span>
                        </div>
                        <div className="flex-1 p-2 space-y-4">
                            <div>
                                <div className="text-[12px] uppercase font-bold text-[#949ba4] px-2 mb-2">Text Channels</div>
                                <div className="bg-[#3f4147] text-white flex items-center px-2 py-1.5 rounded-md cursor-pointer">
                                    <i data-lucide="hash" className="w-4 h-4 mr-2 opacity-50"></i>
                                    <span className="font-medium">general</span>
                                </div>
                            </div>
                            <div>
                                <div className="text-[12px] uppercase font-bold text-[#949ba4] px-2 mb-2">Voice Channels</div>
                                <div 
                                    onClick={joinVoiceChannel}
                                    className={`flex items-center px-2 py-1.5 rounded-md cursor-pointer transition-colors group
                                        ${isInVoiceRoom ? 'bg-[#3f4147] text-white' : 'hover:bg-[#35373c] text-[#949ba4] hover:text-[#dbdee1]'}
                                    `}
                                >
                                    <i data-lucide="volume-2" className="w-4 h-4 mr-2 opacity-50 group-hover:opacity-100"></i>
                                    <span className="font-medium">Voice Room</span>
                                    {isJoiningVoice && <i data-lucide="loader-2" className="w-3 h-3 ml-auto animate-spin"></i>}
                                </div>
                            </div>
                        </div>

                        {/* Voice Status Overlay */}
                        {isInVoiceRoom && (
                            <div className="bg-[#232428] px-3 py-2 border-b border-white/5 flex items-center justify-between">
                                <div className="flex items-center space-x-2 text-[#23a559]">
                                    <div className="w-2 h-2 rounded-full bg-[#23a559] animate-pulse shadow-[0_0_5px_#23a559]"></div>
                                    <span className="text-[11px] font-bold">Voice Connected</span>
                                </div>
                                <i data-lucide="phone-off" className="w-4 h-4 text-red-500 cursor-pointer hover:scale-110" onClick={leaveVoice}></i>
                            </div>
                        )}

                        {/* Profile Footer */}
                        <div className="bg-[#232428] p-2 flex items-center space-x-2">
                            <div className="w-8 h-8 bg-indigo-600 rounded-full flex items-center justify-center font-bold text-xs text-white">
                                {username[0]?.toUpperCase()}
                            </div>
                            <div className="flex-1 min-w-0">
                                <div className="text-white text-xs font-bold truncate">{username}</div>
                                <div className="text-[#949ba4] text-[10px] uppercase font-bold">{connState}</div>
                            </div>
                            <div className="flex space-x-1 text-[#b5bac1]">
                                <i data-lucide="settings" className="w-4 h-4 cursor-pointer hover:text-white" onClick={() => setShowProfileModal(true)}></i>
                            </div>
                        </div>
                    </div>

                    {/* Main Chat Area */}
                    <div className="flex-1 flex flex-col bg-[#313338] min-w-0">
                        <div className="h-12 px-4 flex items-center border-b border-[#1e1f22] shadow-sm">
                            <i data-lucide="hash" className="w-6 h-6 text-[#80848e] mr-2"></i>
                            <span className="font-bold text-white">general</span>
                            <div className="flex-1" />
                            <button 
                                onClick={() => setShowConnectModal(true)}
                                className={`px-3 py-1 rounded text-sm font-bold transition-all ${connState === 'connected' ? 'bg-[#23a559]/20 text-[#23a559]' : 'bg-[#5865f2] text-white hover:bg-[#4752c4]'}`}
                            >
                                {connState === 'connected' ? 'Connected' : 'Connect'}
                            </button>
                        </div>

                        {/* Messages List */}
                        <div className="flex-1 overflow-y-auto p-4 flex flex-col-reverse">
                            <div className="flex flex-col space-y-4">
                                {messages.map(msg => (
                                    <div key={msg.id} className={`flex items-start space-x-4 px-4 py-1 hover:bg-[#2e3035] -mx-4 transition-colors ${msg.system ? 'opacity-50 italic text-xs' : ''}`}>
                                        {!msg.system && <div className="w-10 h-10 bg-[#5865f2] rounded-full flex-shrink-0 flex items-center justify-center font-bold text-white">{msg.user[0]?.toUpperCase()}</div>}
                                        <div className="min-w-0 flex-1">
                                            <div className="flex items-baseline space-x-2">
                                                <span className="font-bold text-white text-[15px]">{msg.user}</span>
                                                <span className="text-[#949ba4] text-[11px]">{msg.timestamp}</span>
                                            </div>
                                            <div className="text-[#dbdee1] text-[15px] break-words">{msg.content}</div>
                                        </div>
                                    </div>
                                ))}
                            </div>
                        </div>

                        {/* Chat Input */}
                        <div className="px-4 pb-6">
                            <div className="bg-[#383a40] rounded-lg px-4 py-2.5 flex items-center space-x-4">
                                <input 
                                    value={inputText}
                                    onChange={(e) => setInputText(e.target.value)}
                                    onKeyDown={(e) => e.key === 'Enter' && sendMessage()}
                                    className="flex-1 bg-transparent outline-none text-[#dbdee1]"
                                    placeholder="Message #general"
                                />
                                <i data-lucide="send" className="text-[#b5bac1] cursor-pointer hover:text-white" onClick={sendMessage}></i>
                            </div>
                        </div>
                    </div>

                    {/* MODAL: Connect / P2P Setup */}
                    {showConnectModal && (
                        <div className="fixed inset-0 bg-black/80 flex items-center justify-center z-50 p-4 backdrop-blur-sm">
                            <div className="bg-[#313338] w-full max-w-md rounded-xl shadow-2xl overflow-hidden border border-white/10 scale-in">
                                <div className="p-6 text-center">
                                    <h2 className="text-xl font-bold text-white mb-4">P2P Connection</h2>
                                    <div className="space-y-4">
                                        <div className="bg-[#2b2d31] p-4 rounded-lg">
                                            <p className="text-[10px] font-bold text-[#b5bac1] uppercase mb-2">1. Your Code</p>
                                            {!sdpData ? (
                                                <button onClick={createOffer} className="w-full bg-[#5865f2] py-2 rounded font-bold text-sm">Create My Code</button>
                                            ) : (
                                                <button 
                                                    onClick={() => { navigator.clipboard.writeText(sdpData); setCopySuccess(true); setTimeout(() => setCopySuccess(false), 1000); }}
                                                    className="w-full bg-[#23a559] py-2 rounded font-bold text-sm"
                                                >
                                                    {copySuccess ? 'Copied!' : 'Copy My Code'}
                                                </button>
                                            )}
                                        </div>
                                        <div className="bg-[#2b2d31] p-4 rounded-lg">
                                            <p className="text-[10px] font-bold text-[#b5bac1] uppercase mb-2">2. Friend's Code</p>
                                            <textarea 
                                                value={remoteSdp}
                                                onChange={(e) => setRemoteSdp(e.target.value)}
                                                className="w-full bg-[#1e1f22] p-2 text-[10px] h-20 rounded text-[#dbdee1] outline-none"
                                                placeholder="Paste code here..."
                                            />
                                            <button onClick={connectToFriend} className="w-full bg-[#5865f2] mt-2 py-2 rounded font-bold text-sm">Link Now</button>
                                        </div>
                                    </div>
                                    <button onClick={() => setShowConnectModal(false)} className="mt-4 text-[#949ba4] text-xs font-bold hover:underline">Close</button>
                                </div>
                            </div>
                        </div>
                    )}

                    {/* MODAL: Create Server */}
                    {showServerModal && (
                        <div className="fixed inset-0 bg-black/80 flex items-center justify-center z-50 p-4 backdrop-blur-sm">
                            <div className="bg-[#313338] w-full max-w-sm rounded-xl p-6 border border-white/10 scale-in text-center">
                                <h2 className="text-xl font-bold text-white mb-2">Create a Server</h2>
                                <p className="text-[#949ba4] text-sm mb-6">Give your new server a name.</p>
                                <input id="server-name-input" autoFocus className="w-full bg-[#1e1f22] p-3 rounded text-white outline-none mb-4" placeholder="Server Name" />
                                <div className="flex space-x-3">
                                    <button onClick={() => setShowServerModal(false)} className="flex-1 py-2 text-white font-bold">Cancel</button>
                                    <button 
                                        onClick={() => addServer(document.getElementById('server-name-input').value)}
                                        className="flex-1 bg-[#5865f2] py-2 rounded font-bold text-white"
                                    >
                                        Create
                                    </button>
                                </div>
                            </div>
                        </div>
                    )}

                    {/* MODAL: Edit Profile */}
                    {showProfileModal && (
                        <div className="fixed inset-0 bg-black/80 flex items-center justify-center z-50 p-4 backdrop-blur-sm">
                            <div className="bg-[#313338] w-full max-w-sm rounded-xl p-6 border border-white/10 scale-in text-center">
                                <h2 className="text-xl font-bold text-white mb-6">Edit Profile</h2>
                                <input 
                                    value={username}
                                    onChange={(e) => setUsername(e.target.value)}
                                    className="w-full bg-[#1e1f22] p-3 rounded text-white outline-none mb-4"
                                    placeholder="Change Username"
                                />
                                <button 
                                    onClick={() => setShowProfileModal(false)}
                                    className="w-full bg-[#5865f2] py-2 rounded font-bold text-white"
                                >
                                    Save Changes
                                </button>
                            </div>
                        </div>
                    )}
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
        
        setInterval(() => lucide.createIcons(), 1000);
    </script>
</body>
</html>
