<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GitHub P2P Chat & Voice</title>
    <!-- Tailwind CSS for styling -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <!-- React and Babel to run JSX in the browser -->
    <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');
        body { font-family: 'Inter', sans-serif; background-color: #313338; margin: 0; }
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: #2b2d31; }
        ::-webkit-scrollbar-thumb { background: #1e1f22; border-radius: 4px; }
        .scale-in { animation: scaleIn 0.2s ease-out; }
        @keyframes scaleIn { from { transform: scale(0.95); opacity: 0; } to { transform: scale(1); opacity: 1; } }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef } = React;

        const App = () => {
            const [username, setUsername] = useState('');
            const [isUsernameSet, setIsUsernameSet] = useState(false);
            const [activeChannel, setActiveChannel] = useState('general');
            const [messages, setMessages] = useState([
                { id: 1, user: 'System', content: 'Welcome! Set your name and use the "Connect" button to start a private voice/text session.', timestamp: 'Today at 12:00 PM', system: true }
            ]);
            const [inputText, setInputText] = useState('');
            const [showConnectModal, setShowConnectModal] = useState(false);
            const [connState, setConnState] = useState('disconnected');
            const [sdpData, setSdpData] = useState('');
            const [remoteSdp, setRemoteSdp] = useState('');
            const [copySuccess, setCopySuccess] = useState(false);
            
            // Voice State
            const [isInCall, setIsInCall] = useState(false);
            const [isMicMuted, setIsMicMuted] = useState(false);

            const pc = useRef(null);
            const dataChannel = useRef(null);
            const localStream = useRef(null);
            const remoteAudio = useRef(new Audio());

            // WebRTC Logic
            const initPeer = () => {
                pc.current = new RTCPeerConnection({ iceServers: [{ urls: 'stun:stun.l.google.com:19302' }] });
                
                pc.current.onicecandidate = (e) => {
                    if (!e.candidate) setSdpData(JSON.stringify(pc.current.localDescription));
                };

                pc.current.ondatachannel = (e) => {
                    dataChannel.current = e.channel;
                    setupChannel(e.channel);
                };

                pc.current.ontrack = (e) => {
                    remoteAudio.current.srcObject = e.streams[0];
                    remoteAudio.current.play();
                    setIsInCall(true);
                };

                pc.current.onconnectionstatechange = () => setConnState(pc.current.connectionState);
            };

            const setupChannel = (channel) => {
                channel.onopen = () => setConnState('connected');
                channel.onmessage = (e) => {
                    const msg = JSON.parse(e.data);
                    setMessages(prev => [msg, ...prev]);
                };
            };

            const createOffer = async () => {
                initPeer();
                dataChannel.current = pc.current.createDataChannel('chat');
                setupChannel(dataChannel.current);
                
                // Add local audio to the connection
                try {
                    localStream.current = await navigator.mediaDevices.getUserMedia({ audio: true });
                    localStream.current.getTracks().forEach(track => pc.current.addTrack(track, localStream.current));
                } catch (err) {
                    console.error("Mic access denied or not found");
                }

                const offer = await pc.current.createOffer();
                await pc.current.setLocalDescription(offer);
            };

            const connectToFriend = async () => {
                if (!remoteSdp) return;
                const desc = new RTCSessionDescription(JSON.parse(remoteSdp));
                if (!pc.current) initPeer();
                
                if (desc.type === 'offer') {
                    try {
                        localStream.current = await navigator.mediaDevices.getUserMedia({ audio: true });
                        localStream.current.getTracks().forEach(track => pc.current.addTrack(track, localStream.current));
                    } catch (err) { console.error("Mic error"); }

                    await pc.current.setRemoteDescription(desc);
                    const answer = await pc.current.createAnswer();
                    await pc.current.setLocalDescription(answer);
                } else {
                    await pc.current.setRemoteDescription(desc);
                }
            };

            const sendMessage = () => {
                if (!inputText.trim()) return;
                const msg = {
                    id: Date.now(),
                    user: username || 'Guest',
                    content: inputText,
                    timestamp: `Today at ${new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })}`
                };
                if (dataChannel.current?.readyState === 'open') {
                    dataChannel.current.send(JSON.stringify(msg));
                }
                setMessages(prev => [msg, ...prev]);
                setInputText('');
            };

            const toggleMic = () => {
                if (localStream.current) {
                    const audioTrack = localStream.current.getAudioTracks()[0];
                    audioTrack.enabled = !audioTrack.enabled;
                    setIsMicMuted(!audioTrack.enabled);
                }
            };

            if (!isUsernameSet) {
                return (
                    <div className="flex h-screen w-full items-center justify-center bg-[#1e1f22]">
                        <div className="bg-[#313338] p-8 rounded-lg shadow-2xl w-full max-w-sm text-center border border-white/5">
                            <h2 className="text-2xl font-bold text-white mb-2">Welcome!</h2>
                            <p className="text-[#949ba4] text-sm mb-6">Choose a username to enter the chat.</p>
                            <input 
                                autoFocus
                                value={username}
                                onChange={(e) => setUsername(e.target.value)}
                                onKeyDown={(e) => e.key === 'Enter' && username.trim() && setIsUsernameSet(true)}
                                placeholder="Username"
                                className="w-full bg-[#1e1f22] p-3 rounded text-white outline-none border border-white/10 focus:border-[#5865f2] mb-4"
                            />
                            <button 
                                onClick={() => username.trim() && setIsUsernameSet(true)}
                                className="w-full bg-[#5865f2] hover:bg-[#4752c4] text-white py-3 rounded font-bold transition-colors"
                            >
                                Get Started
                            </button>
                        </div>
                    </div>
                );
            }

            return (
                <div className="flex h-screen w-full text-[#dbdee1] overflow-hidden antialiased">
                    {/* Sidebar Servers */}
                    <div className="w-[72px] bg-[#1e1f22] flex flex-col items-center py-3 space-y-2 flex-shrink-0">
                        <div className="w-12 h-12 bg-[#5865f2] rounded-[16px] flex items-center justify-center text-white cursor-pointer hover:rounded-[12px] transition-all">
                            <i data-lucide="github"></i>
                        </div>
                        <div className="w-8 h-[2px] bg-[#35363c] rounded-full mx-auto" />
                        <div className="w-12 h-12 bg-[#313338] rounded-[24px] flex items-center justify-center text-[#23a559] hover:bg-[#23a559] hover:text-white hover:rounded-[16px] transition-all cursor-pointer">
                            <i data-lucide="plus"></i>
                        </div>
                    </div>

                    {/* Sidebar Channels */}
                    <div className="w-60 bg-[#2b2d31] flex flex-col flex-shrink-0">
                        <div className="h-12 px-4 flex items-center border-b border-[#1e1f22] font-bold text-white shadow-sm justify-between">
                            <span className="truncate">P2P Hub</span>
                            <i data-lucide="chevron-down" className="w-4 h-4"></i>
                        </div>
                        <div className="flex-1 p-2 space-y-4">
                            <div>
                                <div className="text-[12px] uppercase font-bold text-[#949ba4] px-2 mb-2 flex items-center justify-between">
                                    <span>Text Channels</span>
                                    <i data-lucide="plus" className="w-3 h-3"></i>
                                </div>
                                <div className="bg-[#3f4147] text-white flex items-center px-2 py-1.5 rounded-md cursor-pointer">
                                    <i data-lucide="hash" className="w-4 h-4 mr-2 opacity-50"></i>
                                    <span className="font-medium text-[15px]">general</span>
                                </div>
                            </div>
                            <div>
                                <div className="text-[12px] uppercase font-bold text-[#949ba4] px-2 mb-2 flex items-center justify-between">
                                    <span>Voice Channels</span>
                                    <i data-lucide="plus" className="w-3 h-3"></i>
                                </div>
                                <div className="hover:bg-[#35373c] text-[#949ba4] hover:text-[#dbdee1] flex items-center px-2 py-1.5 rounded-md cursor-pointer group">
                                    <i data-lucide="volume-2" className="w-4 h-4 mr-2 opacity-50 group-hover:opacity-100"></i>
                                    <span className="font-medium text-[15px]">Voice Room</span>
                                </div>
                            </div>
                        </div>

                        {/* Call Controls if in Call */}
                        {isInCall && (
                            <div className="bg-[#232428] px-3 py-2 border-b border-white/5 flex items-center justify-between">
                                <div className="flex items-center space-x-2 text-[#23a559]">
                                    <div className="w-2 h-2 rounded-full bg-[#23a559] animate-pulse"></div>
                                    <span className="text-[11px] font-bold">Voice Connected</span>
                                </div>
                                <i data-lucide="phone-off" className="w-4 h-4 text-red-500 cursor-pointer" onClick={() => window.location.reload()}></i>
                            </div>
                        )}

                        {/* User Profile */}
                        <div className="bg-[#232428] p-2 flex items-center space-x-2">
                            <div className="relative">
                                <div className="w-8 h-8 bg-indigo-600 rounded-full flex items-center justify-center font-bold text-xs">{username[0]?.toUpperCase()}</div>
                                <div className={`absolute bottom-0 right-0 w-3 h-3 rounded-full border-2 border-[#232428] ${connState === 'connected' ? 'bg-[#23a559]' : 'bg-[#80848e]'}`} />
                            </div>
                            <div className="flex-1 min-w-0">
                                <div className="text-white text-xs font-bold truncate">{username}</div>
                                <div className="text-[#949ba4] text-[10px] uppercase font-bold truncate">{connState}</div>
                            </div>
                            <div className="flex space-x-1 text-[#b5bac1]">
                                <button onClick={toggleMic} className={`p-1 rounded hover:bg-[#3f4147] ${isMicMuted ? 'text-red-500' : ''}`}>
                                    <i data-lucide={isMicMuted ? "mic-off" : "mic"} className="w-4 h-4"></i>
                                </button>
                                <button className="p-1 rounded hover:bg-[#3f4147]">
                                    <i data-lucide="settings" className="w-4 h-4"></i>
                                </button>
                            </div>
                        </div>
                    </div>

                    {/* Chat Area */}
                    <div className="flex-1 flex flex-col bg-[#313338] min-w-0">
                        <div className="h-12 px-4 flex items-center border-b border-[#1e1f22] shadow-sm">
                            <i data-lucide="hash" className="w-6 h-6 text-[#80848e] mr-2"></i>
                            <span className="font-bold text-white">{activeChannel}</span>
                            <div className="flex-1" />
                            <div className="flex items-center space-x-4 mr-2">
                                <i data-lucide="phone" className={`w-5 h-5 cursor-pointer hover:text-white ${isInCall ? 'text-[#23a559]' : 'text-[#b5bac1]'}`} onClick={() => setShowConnectModal(true)}></i>
                                <i data-lucide="video" className="w-5 h-5 text-[#b5bac1] cursor-not-allowed"></i>
                                <i data-lucide="bell" className="w-5 h-5 text-[#b5bac1] hover:text-white cursor-pointer"></i>
                            </div>
                            <button 
                                onClick={() => setShowConnectModal(true)}
                                className="bg-[#5865f2] hover:bg-[#4752c4] text-white px-3 py-1 rounded text-sm font-bold transition-colors"
                            >
                                {connState === 'connected' ? 'Connected' : 'Connect'}
                            </button>
                        </div>

                        {/* Messages */}
                        <div className="flex-1 overflow-y-auto p-4 flex flex-col-reverse">
                            <div className="flex flex-col space-y-4">
                                {messages.map(msg => (
                                    <div key={msg.id} className={`flex items-start space-x-4 px-4 py-1 hover:bg-[#2e3035] -mx-4 transition-colors ${msg.system ? 'opacity-50 italic text-xs' : ''}`}>
                                        {!msg.system && <div className="w-10 h-10 bg-[#5865f2] rounded-full flex-shrink-0 flex items-center justify-center font-bold">{msg.user[0]?.toUpperCase()}</div>}
                                        <div>
                                            <div className="flex items-baseline space-x-2">
                                                <span className="font-bold text-white text-[15px]">{msg.user}</span>
                                                <span className="text-[#949ba4] text-[11px]">{msg.timestamp}</span>
                                            </div>
                                            <div className="text-[#dbdee1] text-[15px] leading-snug">{msg.content}</div>
                                        </div>
                                    </div>
                                ))}
                            </div>
                        </div>

                        {/* Input */}
                        <div className="px-4 pb-6">
                            <div className="bg-[#383a40] rounded-lg px-4 py-2.5 flex items-center space-x-4">
                                <i data-lucide="plus-circle" className="text-[#b5bac1] cursor-pointer hover:text-white"></i>
                                <input 
                                    value={inputText}
                                    onChange={(e) => setInputText(e.target.value)}
                                    onKeyDown={(e) => e.key === 'Enter' && sendMessage()}
                                    className="flex-1 bg-transparent outline-none text-[#dbdee1]"
                                    placeholder={`Message #${activeChannel}`}
                                />
                                <div className="flex space-x-3 text-[#b5bac1]">
                                    <i data-lucide="gift" className="cursor-pointer hover:text-white"></i>
                                    <i data-lucide="smile" className="cursor-pointer hover:text-white"></i>
                                    <i data-lucide="send" className={`cursor-pointer ${inputText.trim() ? 'text-white' : 'opacity-30'}`} onClick={sendMessage}></i>
                                </div>
                            </div>
                        </div>
                    </div>

                    {/* Modal */}
                    {showConnectModal && (
                        <div className="fixed inset-0 bg-black/80 flex items-center justify-center z-50 p-4 backdrop-blur-sm">
                            <div className="bg-[#313338] w-full max-w-md rounded-xl shadow-2xl overflow-hidden border border-white/10 scale-in">
                                <div className="p-8 text-center bg-[#35373c]/50">
                                    <h2 className="text-2xl font-bold text-white">Secure Connection</h2>
                                    <p className="text-[#949ba4] text-xs">Voice and text are encrypted peer-to-peer.</p>
                                </div>
                                <div className="p-6 space-y-6">
                                    <div className="bg-[#2b2d31] p-4 rounded-lg">
                                        <p className="text-[10px] font-bold text-[#b5bac1] uppercase mb-2 tracking-wider">Step 1: Your Link Code</p>
                                        {!sdpData ? (
                                            <button onClick={createOffer} className="w-full bg-[#5865f2] py-2 rounded font-bold text-sm">Create Invite Code</button>
                                        ) : (
                                            <button 
                                                onClick={() => { navigator.clipboard.writeText(sdpData); setCopySuccess(true); setTimeout(() => setCopySuccess(false), 2000); }} 
                                                className="w-full bg-[#23a559] py-2 rounded font-bold text-sm"
                                            >
                                                {copySuccess ? 'Copied to Clipboard!' : 'Copy Code & Send to Friend'}
                                            </button>
                                        )}
                                    </div>
                                    <div className="bg-[#2b2d31] p-4 rounded-lg">
                                        <p className="text-[10px] font-bold text-[#b5bac1] uppercase mb-2 tracking-wider">Step 2: Friend's Code</p>
                                        <textarea 
                                            value={remoteSdp}
                                            onChange={(e) => setRemoteSdp(e.target.value)}
                                            className="w-full bg-[#1e1f22] p-2 text-[10px] h-20 outline-none rounded text-[#dbdee1] font-mono border border-white/5"
                                            placeholder="Paste the code your friend sent you..."
                                        />
                                        <button onClick={connectToFriend} className="w-full bg-[#5865f2] py-2 mt-2 rounded font-bold text-sm">Join Session</button>
                                    </div>
                                </div>
                                <div className="p-4 bg-[#2b2d31] flex justify-between items-center border-t border-white/5">
                                    <div className="flex items-center space-x-2">
                                        <div className={`w-2 h-2 rounded-full ${connState === 'connected' ? 'bg-[#23a559]' : 'bg-red-500'}`}></div>
                                        <span className="text-[10px] font-bold uppercase text-[#949ba4]">{connState}</span>
                                    </div>
                                    <button onClick={() => setShowConnectModal(false)} className="text-white text-xs font-bold hover:underline">Close</button>
                                </div>
                            </div>
                        </div>
                    )}
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
        
        // Refresh icons whenever React state changes that might affect UI
        setInterval(() => lucide.createIcons(), 1000);
    </script>
</body>
</html>
