<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>P2P Chat & Voice</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');
        body { font-family: 'Inter', sans-serif; background-color: #313338; margin: 0; color: #dbdee1; overflow: hidden; }
        .scale-in { animation: scaleIn 0.2s ease-out; }
        @keyframes scaleIn { from { transform: scale(0.95); opacity: 0; } to { transform: scale(1); opacity: 1; } }
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: #2b2d31; }
        ::-webkit-scrollbar-thumb { background: #1e1f22; border-radius: 4px; }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef } = React;

        const App = () => {
            // Persistence
            const [username, setUsername] = useState(localStorage.getItem('p2p-username') || '');
            const [isUsernameSet, setIsUsernameSet] = useState(!!localStorage.getItem('p2p-username'));
            const [messages, setMessages] = useState(JSON.parse(localStorage.getItem('p2p-messages')) || []);
            const [servers, setServers] = useState(JSON.parse(localStorage.getItem('p2p-servers')) || [{ id: 'home', name: 'Home', icon: 'github' }]);
            const [activeServer, setActiveServer] = useState('home');
            
            // Connection State
            const [connState, setConnState] = useState('disconnected');
            const [localSdp, setLocalSdp] = useState(localStorage.getItem('p2p-local-sdp') || '');
            const [remoteSdp, setRemoteSdp] = useState(localStorage.getItem('p2p-remote-sdp') || '');
            const [isGenerating, setIsGenerating] = useState(false);
            const [copySuccess, setCopySuccess] = useState(false);
            const [inputText, setInputText] = useState('');
            const [logs, setLogs] = useState(['App started.']);

            // UI Modals
            const [showConnectModal, setShowConnectModal] = useState(false);
            const [showServerModal, setShowServerModal] = useState(false);
            const [showProfileModal, setShowProfileModal] = useState(false);

            // Voice State
            const [isJoiningVoice, setIsJoiningVoice] = useState(false);
            const [isInVoiceRoom, setIsInVoiceRoom] = useState(false);

            const pc = useRef(null);
            const dataChannel = useRef(null);
            const localStream = useRef(null);
            const remoteAudio = useRef(new Audio());

            const addLog = (msg) => setLogs(prev => [...prev.slice(-4), `> ${msg}`]);

            useEffect(() => { localStorage.setItem('p2p-username', username); }, [username]);
            useEffect(() => { localStorage.setItem('p2p-messages', JSON.stringify(messages)); }, [messages]);
            useEffect(() => { localStorage.setItem('p2p-servers', JSON.stringify(servers)); }, [servers]);
            useEffect(() => { localStorage.setItem('p2p-local-sdp', localSdp); }, [localSdp]);
            useEffect(() => { localStorage.setItem('p2p-remote-sdp', remoteSdp); }, [remoteSdp]);

            const initPeer = () => {
                if (pc.current) return;
                addLog("Initializing Peer Connection...");
                pc.current = new RTCPeerConnection({ 
                    iceServers: [
                        { urls: 'stun:stun.l.google.com:19302' },
                        { urls: 'stun:stun1.l.google.com:19302' },
                        { urls: 'stun:stun2.l.google.com:19302' }
                    ] 
                });

                pc.current.onicecandidate = (e) => {
                    if (!e.candidate && pc.current.localDescription) {
                        addLog("ICE Gathering Complete.");
                        setLocalSdp(JSON.stringify(pc.current.localDescription));
                        setIsGenerating(false);
                    }
                };

                pc.current.onconnectionstatechange = () => {
                    setConnState(pc.current.connectionState);
                    addLog(`Connection State: ${pc.current.connectionState}`);
                    if (pc.current.connectionState === 'connected') {
                        setTimeout(() => setShowConnectModal(false), 1500);
                    }
                };

                pc.current.ondatachannel = (e) => {
                    addLog("Data Channel received.");
                    dataChannel.current = e.channel;
                    setupDataChannel(e.channel);
                };

                pc.current.ontrack = (e) => {
                    addLog("Voice track received.");
                    remoteAudio.current.srcObject = e.streams[0];
                    remoteAudio.current.play().catch(console.error);
                    setIsInVoiceRoom(true);
                };
            };

            const setupDataChannel = (channel) => {
                channel.onopen = () => {
                    setConnState('connected');
                    addLog("Chat Channel Open.");
                };
                channel.onclose = () => setConnState('disconnected');
                channel.onmessage = (e) => {
                    try {
                        const msg = JSON.parse(e.data);
                        setMessages(prev => [msg, ...prev]);
                    } catch (err) { console.error("Message error", err); }
                };
            };

            const generateInvite = async () => {
                setIsGenerating(true);
                initPeer();
                try {
                    dataChannel.current = pc.current.createDataChannel('chat');
                    setupDataChannel(dataChannel.current);
                    const offer = await pc.current.createOffer();
                    await pc.current.setLocalDescription(offer);
                    addLog("Offer created. Waiting for network...");
                    
                    setTimeout(() => {
                        if (isGenerating) {
                            addLog("Forcing code display (Timeout).");
                            setLocalSdp(JSON.stringify(pc.current.localDescription));
                            setIsGenerating(false);
                        }
                    }, 4000);
                } catch (err) {
                    setIsGenerating(false);
                    addLog("Error generating invite.");
                }
            };

            const applyFriendCode = async () => {
                if (!remoteSdp) return;
                addLog("Applying remote code...");
                try {
                    const remoteDesc = JSON.parse(remoteSdp);
                    initPeer();
                    
                    await pc.current.setRemoteDescription(new RTCSessionDescription(remoteDesc));
                    addLog("Remote code applied.");
                    
                    if (remoteDesc.type === 'offer') {
                        addLog("Received Offer. Generating Answer...");
                        const answer = await pc.current.createAnswer();
                        await pc.current.setLocalDescription(answer);
                        // Answer is generated, ICE handler will update localSdp automatically
                    }
                } catch (err) {
                    addLog("Failed to apply code.");
                    alert("Invalid Code format.");
                }
            };

            const joinVoiceChannel = async () => {
                if (connState !== 'connected') {
                    alert("Connect with a friend first!");
                    return;
                }
                setIsJoiningVoice(true);
                try {
                    localStream.current = await navigator.mediaDevices.getUserMedia({ audio: true });
                    localStream.current.getTracks().forEach(track => pc.current.addTrack(track, localStream.current));
                    const offer = await pc.current.createOffer();
                    await pc.current.setLocalDescription(offer);
                    setShowConnectModal(true); 
                } catch (err) {
                    alert("Mic access denied.");
                }
                setIsJoiningVoice(false);
            };

            const leaveVoice = () => {
                if (localStream.current) {
                    localStream.current.getTracks().forEach(track => track.stop());
                    localStream.current = null;
                }
                setIsInVoiceRoom(false);
            };

            const sendMessage = () => {
                if (!inputText.trim()) return;
                const msg = {
                    id: Date.now(),
                    user: username,
                    content: inputText,
                    timestamp: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })
                };
                if (dataChannel.current?.readyState === 'open') {
                    dataChannel.current.send(JSON.stringify(msg));
                }
                setMessages(prev => [msg, ...prev]);
                setInputText('');
            };

            const resetHandshake = () => {
                setLocalSdp('');
                setRemoteSdp('');
                setConnState('disconnected');
                pc.current = null;
                addLog("Handshake reset.");
            };

            const addServer = (name) => {
                if(!name.trim()) return;
                const newServer = { id: Date.now().toString(), name, icon: 'hash' };
                setServers([...servers, newServer]);
                setShowServerModal(false);
            };

            if (!isUsernameSet) {
                return (
                    <div className="flex h-screen w-full items-center justify-center bg-[#1e1f22]">
                        <div className="bg-[#313338] p-8 rounded-lg shadow-xl w-80 text-center scale-in border border-white/5">
                            <h2 className="text-xl font-bold mb-4 text-white">Choose a Name</h2>
                            <input 
                                value={username} 
                                onChange={e => setUsername(e.target.value)}
                                onKeyDown={e => e.key === 'Enter' && username && setIsUsernameSet(true)}
                                className="w-full bg-[#1e1f22] p-2 rounded mb-4 outline-none border border-white/10 text-white" 
                            />
                            <button 
                                onClick={() => username && setIsUsernameSet(true)}
                                className="w-full bg-[#5865f2] py-2 rounded font-bold hover:bg-[#4752c4] text-white"
                            >
                                Start Chatting
                            </button>
                        </div>
                    </div>
                );
            }

            return (
                <div className="flex h-screen w-full select-none overflow-hidden">
                    {/* Servers Sidebar */}
                    <div className="w-[72px] bg-[#1e1f22] flex flex-col items-center py-3 space-y-2 flex-shrink-0">
                        {servers.map(server => (
                            <div 
                                key={server.id}
                                onClick={() => setActiveServer(server.id)}
                                className={`w-12 h-12 rounded-[24px] flex items-center justify-center cursor-pointer transition-all duration-200 group relative
                                    ${activeServer === server.id ? 'rounded-[16px] bg-[#5865f2] text-white' : 'bg-[#313338] text-[#23a559] hover:rounded-[16px] hover:bg-[#23a559] hover:text-white'}
                                `}
                            >
                                <i data-lucide={server.icon || 'hash'} className="w-6 h-6"></i>
                                {activeServer === server.id && <div className="absolute -left-3 w-2 h-8 bg-white rounded-r-full" />}
                            </div>
                        ))}
                        <div className="w-8 h-[2px] bg-[#35363c] rounded-full mx-auto" />
                        <div onClick={() => setShowServerModal(true)} className="w-12 h-12 bg-[#313338] rounded-[24px] flex items-center justify-center text-[#23a559] hover:bg-[#23a559] hover:text-white hover:rounded-[16px] transition-all cursor-pointer">
                            <i data-lucide="plus"></i>
                        </div>
                    </div>

                    {/* Channels Sidebar */}
                    <div className="w-60 bg-[#2b2d31] flex flex-col flex-shrink-0 border-r border-black/20">
                        <div className="h-12 px-4 flex items-center border-b border-[#1e1f22] font-bold text-white">
                            <span className="truncate">{servers.find(s => s.id === activeServer)?.name}</span>
                        </div>
                        <div className="flex-1 p-2 space-y-4">
                            <div>
                                <div className="text-[11px] uppercase font-bold text-[#949ba4] px-2 mb-2 tracking-wider">Text Channels</div>
                                <div className="bg-[#3f4147] text-white flex items-center px-2 py-1.5 rounded-md cursor-pointer">
                                    <i data-lucide="hash" className="w-4 h-4 mr-2 opacity-50"></i>
                                    <span className="font-medium text-sm">general</span>
                                </div>
                            </div>
                            <div>
                                <div className="text-[11px] uppercase font-bold text-[#949ba4] px-2 mb-2 tracking-wider">Voice Channels</div>
                                <div onClick={joinVoiceChannel} className={`flex items-center px-2 py-1.5 rounded-md cursor-pointer transition-colors group ${isInVoiceRoom ? 'bg-[#3f4147] text-white' : 'hover:bg-[#35373c] text-[#949ba4] hover:text-[#dbdee1]'}`}>
                                    <i data-lucide="volume-2" className="w-4 h-4 mr-2 opacity-50"></i>
                                    <span className="font-medium text-sm">Voice Room</span>
                                    {isJoiningVoice && <i data-lucide="loader-2" className="w-3 h-3 ml-auto animate-spin"></i>}
                                </div>
                            </div>
                        </div>

                        {isInVoiceRoom && (
                            <div className="bg-[#232428] px-3 py-2 border-b border-white/5 flex items-center justify-between">
                                <div className="flex items-center space-x-2 text-[#23a559]">
                                    <div className="w-2 h-2 rounded-full bg-[#23a559] animate-pulse"></div>
                                    <span className="text-[10px] font-bold uppercase">Connected</span>
                                </div>
                                <i data-lucide="phone-off" className="w-4 h-4 text-red-500 cursor-pointer hover:scale-110" onClick={leaveVoice}></i>
                            </div>
                        )}

                        <div className="bg-[#232428] p-2 flex items-center space-x-2">
                            <div className="w-8 h-8 bg-[#5865f2] rounded-full flex items-center justify-center font-bold text-xs text-white uppercase">{username[0]}</div>
                            <div className="flex-1 min-w-0">
                                <div className="text-white text-xs font-bold truncate">{username}</div>
                                <div className={`text-[10px] uppercase font-bold ${connState === 'connected' ? 'text-[#23a559]' : 'text-[#949ba4]'}`}>
                                    {connState}
                                </div>
                            </div>
                            <i data-lucide="settings" className="w-4 h-4 cursor-pointer hover:text-white text-[#b5bac1]" onClick={() => setShowProfileModal(true)}></i>
                        </div>
                    </div>

                    {/* Chat Window */}
                    <div className="flex-1 flex flex-col bg-[#313338] min-w-0">
                        <div className="h-12 border-b border-black/20 flex items-center px-4 shadow-sm">
                            <i data-lucide="hash" className="w-5 h-5 text-[#80848e] mr-2"></i>
                            <span className="font-bold text-white text-sm">general</span>
                            <div className="flex-1" />
                            <button 
                                onClick={() => setShowConnectModal(true)}
                                className={`px-3 py-1 rounded text-xs font-bold transition-all flex items-center ${connState === 'connected' ? 'bg-[#23a559]/20 text-[#23a559]' : 'bg-[#5865f2] text-white hover:bg-[#4752c4]'}`}
                            >
                                <i data-lucide="link" className="w-3 h-3 mr-1.5"></i>
                                {connState === 'connected' ? 'Connected' : 'Connect'}
                            </button>
                        </div>
                        
                        <div className="flex-1 overflow-y-auto p-4 flex flex-col-reverse space-y-reverse space-y-4">
                            {messages.map(m => (
                                <div key={m.id} className="flex items-start space-x-3 p-1 rounded hover:bg-black/5">
                                    <div className="w-10 h-10 bg-[#5865f2] rounded-full flex-shrink-0 flex items-center justify-center font-bold uppercase text-white">{m.user[0]}</div>
                                    <div>
                                        <div className="flex items-baseline space-x-2">
                                            <span className="font-bold text-white text-sm">{m.user}</span>
                                            <span className="text-[10px] text-[#949ba4]">{m.timestamp}</span>
                                        </div>
                                        <p className="text-sm text-[#dbdee1] break-words">{m.content}</p>
                                    </div>
                                </div>
                            ))}
                        </div>

                        <div className="p-4">
                            <div className="bg-[#383a40] rounded-lg px-4 py-2.5 flex items-center shadow-inner">
                                <input 
                                    className="flex-1 bg-transparent outline-none text-sm text-[#dbdee1]" 
                                    placeholder="Message #general" 
                                    value={inputText}
                                    onChange={e => setInputText(e.target.value)}
                                    onKeyDown={e => e.key === 'Enter' && sendMessage()}
                                />
                                <button onClick={sendMessage} className="text-[#b5bac1] hover:text-white transition-colors">
                                    <i data-lucide="send" className="w-5 h-5"></i>
                                </button>
                            </div>
                        </div>
                    </div>

                    {/* Connection Modal */}
                    {showConnectModal && (
                        <div className="fixed inset-0 bg-black/80 flex items-center justify-center z-50 p-4 backdrop-blur-sm">
                            <div className="bg-[#313338] w-full max-w-md rounded-xl p-6 shadow-2xl border border-white/5 scale-in flex flex-col max-h-[90vh]">
                                <h2 className="text-xl font-bold text-center mb-2 text-white flex items-center justify-center">
                                    <i data-lucide="link" className="w-5 h-5 mr-2"></i> P2P Handshake
                                </h2>
                                
                                <div className="space-y-4 overflow-y-auto pr-1 mt-4">
                                    <div className="bg-[#2b2d31] p-4 rounded-lg border border-white/5">
                                        <div className="flex items-center space-x-2 mb-3">
                                            <div className="w-5 h-5 rounded-full bg-[#5865f2] text-xs flex items-center justify-center font-bold">1</div>
                                            <p className="text-xs font-bold text-white uppercase tracking-tight">Your Code</p>
                                        </div>
                                        <button onClick={generateInvite} disabled={isGenerating} className={`w-full py-2 rounded font-bold text-sm text-white ${isGenerating ? 'bg-gray-600 animate-pulse' : 'bg-[#5865f2] hover:bg-[#4752c4]'}`}>
                                            {isGenerating ? 'Finding Network...' : localSdp ? 'Regenerate Code' : 'Generate My Code'}
                                        </button>
                                        {localSdp && !isGenerating && (
                                            <button onClick={() => { navigator.clipboard.writeText(localSdp); setCopySuccess(true); setTimeout(() => setCopySuccess(false), 2000); }} className="w-full mt-2 bg-[#23a559] py-2 rounded font-bold text-sm flex items-center justify-center text-white">
                                                <i data-lucide={copySuccess ? "check" : "copy"} className="w-4 h-4 mr-2"></i> {copySuccess ? 'Copied!' : 'Copy & Send to Friend'}
                                            </button>
                                        )}
                                    </div>

                                    <div className="bg-[#2b2d31] p-4 rounded-lg border border-white/5">
                                        <div className="flex items-center space-x-2 mb-3">
                                            <div className="w-5 h-5 rounded-full bg-[#5865f2] text-xs flex items-center justify-center font-bold">2</div>
                                            <p className="text-xs font-bold text-white uppercase tracking-tight">Friend's Code</p>
                                        </div>
                                        <textarea className="w-full bg-[#1e1f22] p-2 rounded h-20 text-[10px] font-mono outline-none border border-white/5 resize-none text-[#dbdee1]" placeholder="Paste friend's code here..." value={remoteSdp} onChange={e => setRemoteSdp(e.target.value)} />
                                        <button onClick={applyFriendCode} className="w-full mt-2 bg-white text-black py-2 rounded font-bold text-sm">Apply Friend's Code</button>
                                    </div>

                                    <div className="bg-[#2b2d31] p-4 rounded-lg border border-white/5">
                                        <div className="flex items-center space-x-2 mb-2 text-[#23a559]">
                                            <div className="w-5 h-5 rounded-full bg-[#23a559] text-xs flex items-center justify-center font-bold text-white">3</div>
                                            <p className="text-xs font-bold uppercase tracking-tight">Check Status</p>
                                        </div>
                                        <div className="bg-black/20 p-2 rounded text-[10px] font-mono text-gray-400 space-y-1">
                                            {logs.map((log, i) => <div key={i} className="truncate">{log}</div>)}
                                        </div>
                                    </div>
                                </div>

                                <div className="mt-6 flex justify-between items-center text-xs">
                                    <button onClick={resetHandshake} className="text-red-400 hover:text-red-300 font-bold transition-colors">Reset Link</button>
                                    <button onClick={() => setShowConnectModal(false)} className="px-4 py-1.5 bg-[#4e5058] rounded text-white font-bold hover:bg-[#6d6f78]">Close</button>
                                </div>
                            </div>
                        </div>
                    )}

                    {/* Standard Modals */}
                    {showServerModal && (
                        <div className="fixed inset-0 bg-black/80 flex items-center justify-center z-50 p-4">
                            <div className="bg-[#313338] w-full max-w-sm rounded-xl p-6 border border-white/10 scale-in text-center">
                                <h2 className="text-xl font-bold text-white mb-4 uppercase text-sm tracking-widest">Create Server</h2>
                                <input id="sn" autoFocus className="w-full bg-[#1e1f22] p-3 rounded text-white outline-none mb-6 border border-white/5" placeholder="Server Name" />
                                <div className="flex space-x-3">
                                    <button onClick={() => setShowServerModal(false)} className="flex-1 py-2 text-[#949ba4] font-bold">Cancel</button>
                                    <button onClick={() => addServer(document.getElementById('sn').value)} className="flex-1 bg-[#23a559] py-2 rounded font-bold text-white">Create</button>
                                </div>
                            </div>
                        </div>
                    )}
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
        setInterval(() => window.lucide && window.lucide.createIcons(), 1000);
    </script>
</body>
</html>
